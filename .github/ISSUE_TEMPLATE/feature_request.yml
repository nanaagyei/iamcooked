name: Feature request
description: Suggest an idea, a new ecosystem, or a new check
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I use Cursor with 12 MCP servers and can't tell which ones…"
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
