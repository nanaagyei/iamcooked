name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI + engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @iamcooked/core --filter @iamcooked/scanner --filter iamcooked typecheck
      - name: Unit tests
        run: pnpm --filter @iamcooked/core --filter @iamcooked/scanner --filter iamcooked test
      - name: Build CLI
        run: pnpm --filter iamcooked build
      - name: Smoke test CLI
        run: |
          node packages/cli/dist/iamcooked.mjs --version
          node packages/cli/dist/iamcooked.mjs --help > /dev/null
      # Dogfooding: iamcooked scans itself. Fails on critical production issues or malware.
      - name: Am I cooked?
        run: node packages/cli/dist/iamcooked.mjs . --prod --fail-on critical

  web:
    name: Web app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iamcooked_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iamcooked_test
      NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @iamcooked/db db:generate

      - name: Push database schema
        run: pnpm --filter @iamcooked/db db:push

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @iamcooked/web exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm --filter @iamcooked/web test:e2e
