name: Release CLI

# Publish the `iamcooked` CLI to npm when a tag like `cli-v0.2.0` is pushed.
# Requires an NPM_TOKEN repository secret with publish rights.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then echo "Tag $tag != package.json $pkg"; exit 1; fi
      - run: pnpm --filter @iamcooked/core --filter @iamcooked/scanner --filter iamcooked test
      - run: pnpm --filter iamcooked build
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
